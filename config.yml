keypress_delay_ms: 10

keymap:
  - name: Application preferencesQ
    exact_match: true
    application:
      not: [ code_code, Code, code ]
    remap:
      Super-Comma: Ctrl-Comma
  - name: Application Command shortcuts
    exact_match: true
    application:
      not: [org.gnome.Terminal, org.gnome.Console, org.gnome.Ptyxis, code_code, Code, code]
    remap:
      Super-A: Ctrl-A
      Super-C: Ctrl-C
      Super-D: Ctrl-D
      Super-O: Ctrl-O
      Super-P: Ctrl-P
      Super-V: Ctrl-V
      Super-X: Ctrl-X
      Super-Y: Ctrl-Y
      Super-W: Ctrl-W
      Super-Q: Ctrl-Q
      Super-T: Ctrl-T
      Super-N: Ctrl-N
      Super-F: Ctrl-F
      Super-L: Ctrl-L
      Super-R: Ctrl-R
      Super-S: Ctrl-S
      Super-Z: Ctrl-Z
      Super-Shift-Z: Ctrl-Shift-Z
      Super-Shift-T: Ctrl-Shift-T
  - name: Previous and next word
    exact_match: true
    application:
      not: [org.gnome.Terminal, org.gnome.Console, org.gnome.Ptyxis, code_code, Code, code]
    remap:
      Ctrl-A: Ctrl-Left
      Ctrl-E: Ctrl-Right
      Ctrl-Shift-A: Ctrl-Shift-Left
      Ctrl-Shift-E: Ctrl-Shift-Right
  - name: Make ⌘← and ⌘→ work as Home and End (with Shift for selection)
    exact_match: true
    application:
      not: [code_code, Code, code]
    remap:
      Super-Left: Home
      Super-Right: End
      Shift-Super-Left: Shift-Home
      Shift-Super-Right: Shift-End
  - name: Delete word
    exact_match: true
    application:
      not: [code_code, Code, code]
    remap:
      Alt-Backspace: Ctrl-Backspace
  - name: Nautilus (Files) shortcuts
    exact_match: true
    application:
      only: org.gnome.Nautilus
    remap:
      Super-Up: Alt-Up
      Super-Down: Enter
      Super-Backspace:
        - press: LeftCtrl
        - release: LeftCtrl
        - Delete
        - press: LeftCtrl
        - release: LeftCtrl
      Shift-Super-Dot: Ctrl-H
      Shift-Super-G: Ctrl-L
  - name: Terminal, Console and Ptyxis Command shortcuts
    exact_match: true
    application:
      only: [org.gnome.Terminal, org.gnome.Console, org.gnome.Ptyxis]
    remap:
      Super-A: Ctrl-A
      Super-C: Ctrl-Shift-C
      Super-V: Ctrl-Shift-V
      Super-N: Ctrl-Shift-N
      Super-Q: Ctrl-Shift-Q
      Super-T: Ctrl-Shift-T
      Super-W: Ctrl-Shift-W
      Super-F: Ctrl-Shift-F
